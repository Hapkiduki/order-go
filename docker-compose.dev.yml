# =============================================================================
# Docker Compose - Development Environment
# =============================================================================
# Lightweight development setup with only infrastructure services
# Application runs locally with Air for hot reload
#
# Usage:
#   docker-compose -f docker-compose.dev.yml up -d    # Start infrastructure
#   air                                              # Run app with hot reload
#   docker-compose -f docker-compose.dev.yml down    # Stop infrastructure
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ops-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - ops-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # Redis Cache
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: ops-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    restart: unless-stopped
    networks:
      - ops-network-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

  # ===========================================================================
  # Adminer - Database Management UI (Development only)
  # ===========================================================================
  adminer:
    image: adminer:latest
    container_name: ops-adminer-dev
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - ops-network-dev

# =============================================================================
# Networks
# =============================================================================
networks:
  ops-network-dev:
    driver: bridge
    name: ops-network-dev

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-dev-data:
    name: ops-postgres-dev-data
  redis-dev-data:
    name: ops-redis-dev-data

